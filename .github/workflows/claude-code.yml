name: Claude Code — Auto Write & Review

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task:
        description: "Task for Claude Code (outline, draft, review, revise)"
        required: true
        default: "review latest chapter draft"

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          task: ${{ github.event.inputs.task || 'Review latest changes and suggest improvements' }}
